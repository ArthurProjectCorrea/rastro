name: Deploy mockup

on:
  push:
    branches: [develop]
    paths:
      - 'docs/mockup/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-mockup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mockup
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The mockup must be consistent before it is published
      - name: Validate mockup
        run: python3 .claude/hooks/validate.py --all

      # Uploads only docs/mockup (see assets.directory in wrangler.jsonc)
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
